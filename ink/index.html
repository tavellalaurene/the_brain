<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress aigu — encre</title>
<style>
  :root { --bg: #0e0d0c; --ink: #f2ede4; --muted: #a39d93; --line: #2e2b27;
    --panel: rgba(14,13,12,.9); --accent: #2fd6b5; --warn: #ffb020; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 18px/1.55 Georgia, "Times New Roman", serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .sans { font-family: system-ui, sans-serif; }

  header { position: fixed; top: 20px; left: 24px; pointer-events: none; }
  header h1 { margin: 0; font-weight: normal; font-size: 26px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

  .label { font: 13px/1.2 system-ui, sans-serif; color: var(--muted); white-space: nowrap;
    opacity: .45; transition: opacity .5s, color .5s; pointer-events: none; text-shadow: 0 0 6px #000; }
  .label.on { color: var(--ink); opacity: 1; }
  .sig { font: 600 12px system-ui, sans-serif; padding: 1px 7px; border-radius: 99px; background: rgba(0,0,0,.6);
    border: 1px solid currentColor; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .sig.on { opacity: 1; }

  /* Jauges */
  #gauges { position: fixed; top: 96px; left: 24px; width: 230px; }
  .g { display: grid; grid-template-columns: 1fr auto; align-items: end; margin-bottom: 10px; }
  .g span { font: 13px system-ui, sans-serif; color: var(--muted); }
  .g canvas { grid-column: 1 / 3; width: 100%; height: 30px; }
  #gauges small { font: 11px system-ui, sans-serif; color: var(--muted); opacity: .7; }

  /* Panneau */
  #panel { position: fixed; right: 24px; top: 50%; transform: translateY(-50%); width: min(440px, calc(100vw - 48px));
    max-height: calc(100vh - 200px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px 22px; backdrop-filter: blur(8px); }
  #kicker { font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
  #stepTitle { margin: 2px 0 12px; font-weight: normal; font-size: 16px; color: var(--muted); }
  #say { font-size: 21px; line-height: 1.45; margin: 0 0 14px; min-height: 3em; transition: opacity .3s; }
  #say.insight { color: var(--accent); }
  #say.insight::before { content: "À retenir"; display: block; font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .cause { font: 14px/1.4 system-ui, sans-serif; color: #d9d3c9; margin: 6px 0; }
  .cause b { font-weight: 600; }
  .cause .arrow { white-space: nowrap; font-weight: 600; }
  .dots { display: flex; gap: 6px; margin: 16px 0 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--ink); }
  nav { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  nav button { font: 15px system-ui, sans-serif; background: none; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  nav button.primary { border-color: var(--accent); }
  nav button:hover:not(:disabled) { background: #1c1a17; }
  nav button:disabled { opacity: .3; cursor: default; }
  nav .hint { margin-left: auto; font: 12px system-ui, sans-serif; color: var(--muted); }

  details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; font: 14px/1.5 system-ui, sans-serif; color: #cfc9bf; }
  summary { cursor: pointer; color: var(--muted); }
  .note { border-left: 2px solid var(--line); padding-left: 10px; margin: 10px 0; }
  .note.verify { border-color: var(--warn); }
  .note b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.strong { border-color: var(--accent); color: var(--ink); }
  details a { color: var(--ink); }
  details ul { padding-left: 18px; margin: 6px 0; }

  /* Frise */
  #timeline { position: fixed; left: 24px; right: 500px; bottom: 22px; font: 12px system-ui, sans-serif; color: var(--muted); }
  #timeline .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  #now { color: var(--ink); font-size: 14px; }
  #scrub { width: 100%; accent-color: var(--accent); cursor: pointer; }
  #ticks { position: relative; height: 16px; }
  #ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

  @media (max-width: 860px) {
    #gauges { display: none; }
    #panel { top: auto; bottom: 96px; transform: none; max-height: 52vh; right: 16px; }
    #say { font-size: 19px; }
    #timeline { left: 16px; right: 16px; bottom: 16px; }
    header { left: 16px; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<header><h1 id="title"></h1><p id="subtitle"></p></header>

<section id="gauges" aria-label="Jauges"></section>

<aside id="panel" aria-live="polite">
  <div id="kicker"></div>
  <h2 id="stepTitle"></h2>
  <p id="say"></p>
  <div id="causes"></div>
  <div class="dots" id="dots"></div>
  <nav>
    <button id="prev" aria-label="Précédent">←</button>
    <button id="next" class="primary">Suivant →</button>
    <span class="hint">ou flèches du clavier</span>
  </nav>
  <details id="more"><summary>En savoir plus</summary><div id="moreBody"></div></details>
</aside>

<div id="timeline">
  <div class="row"><span>Fais glisser le temps</span><span id="now"></span></div>
  <input id="scrub" type="range" min="0" max="1000" step="1" aria-label="Temps écoulé depuis le stimulus">
  <div id="ticks"></div>
</div>

<script src="data/stress-aigu.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const D = window.INK_SCENARIO;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── Rendu ────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$('scene').appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
$('scene').appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0d0c);
scene.fog = new THREE.Fog(0x0e0d0c, 6, 22);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

// Texture de halo (dégradé radial) partagée par toutes les lueurs
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const glow = (color, size) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
  s.scale.setScalar(size); scene.add(s); return s;
};

// ── Silhouette schématique : anneaux de contour ──────────────
// Corps de révolution elliptique : (y, demi-largeur x, demi-profondeur z)
const HEAD = { y: 1.3, ry: 1.75, rx: 1.35, rz: 1.6 };
const BODY = [[-0.2, .69, .82], [-0.55, .5, .55], [-0.95, .55, .56], [-1.2, 1.7, .78],
              [-1.55, 2.2, .9], [-2.4, 2.05, 1.0], [-3.4, 1.75, .95], [-4.6, 1.55, .85], [-5.6, 1.6, .82]];
function radius(y) {
  if (y > -0.2) { const k = Math.sqrt(Math.max(0, 1 - ((y - HEAD.y) / HEAD.ry) ** 2)); return [HEAD.rx * k, HEAD.rz * k]; }
  for (let i = 0; i < BODY.length - 1; i++) {
    const [y0, x0, z0] = BODY[i], [y1, x1, z1] = BODY[i + 1];
    if (y <= y0 && y >= y1) { let u = (y0 - y) / (y0 - y1); u = u * u * (3 - 2 * u); return [x0 + (x1 - x0) * u, z0 + (z1 - z0) * u]; }
  }
  return [0, 0];
}
function ring(y, rx, rz, color, opacity, wobble = 0, phase = 0, cz = 0) {
  const pts = [];
  for (let i = 0; i <= 96; i++) {
    const a = i / 96 * Math.PI * 2, w = 1 + wobble * Math.sin(a * 9 + phase) * Math.sin(a * 4 - phase);
    pts.push(new THREE.Vector3(Math.cos(a) * rx * w, y, cz + Math.sin(a) * rz * w));
  }
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
  scene.add(l); return l;
}
for (let y = HEAD.y + HEAD.ry - 0.05; y > -5.6; y -= 0.11) {
  const [rx, rz] = radius(y);
  const fade = y < -4.4 ? Math.max(0, 1 - (-4.4 - y) / 1.2) : 1;   // le buste se dissout vers le bas
  if (rx > 0.02) ring(y, rx, rz, 0xb8b0a2, 0.13 * fade);
}
// Cerveau : anneaux plus denses, ondulés (évoque les circonvolutions)
const BRAIN = { y: 1.75, ry: 1.05, rx: 1.12, rz: 1.45, z: 0.05 };
for (let i = 1; i < 26; i++) {
  const y = BRAIN.y - BRAIN.ry + i * (2 * BRAIN.ry / 26), k = Math.sqrt(1 - ((y - BRAIN.y) / BRAIN.ry) ** 2);
  ring(y, BRAIN.rx * k, BRAIN.rz * k, 0xe9d8c4, 0.2, 0.05, i * 0.7, BRAIN.z);
}

// ── Structures ───────────────────────────────────────────────
const nodes = {};
for (const s of D.structures) {
  const core = new THREE.Mesh(new THREE.SphereGeometry(s.size, 32, 20),
    new THREE.MeshBasicMaterial({ color: 0xf2ede4, transparent: true, opacity: s.shell ? .06 : .18, depthWrite: false,
      wireframe: !!s.shell }));
  core.position.fromArray(s.pos); scene.add(core);
  const halo = glow(0xfff4e0, s.size * 5); halo.position.copy(core.position);
  const el = document.createElement('div'); el.className = 'label'; el.textContent = s.label;
  const lab = new CSS2DObject(el);
  lab.position.set(s.shell ? 0 : s.size + .08, s.shell ? -s.size - .14 : 0, 0);
  lab.center.set(s.shell ? .5 : 0, .5);
  core.add(lab);
  nodes[s.id] = { s, core, halo, el, lit: 0 };
}

// ── Voies : filaments + impulsions ───────────────────────────
const P = id => new THREE.Vector3().fromArray(nodes[id].s.pos);
const paths = {};
for (const p of D.pathways) {
  const m = D.messengers[p.messenger], color = new THREE.Color(m.color);
  const a = P(p.from), b = P(p.to);
  const mid = p.via ? new THREE.Vector3().fromArray(p.via) : a.clone().lerp(b, .5).add(new THREE.Vector3(.15, .2, .15));
  const curve = new THREE.CatmullRomCurve3([a, mid, b]);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(80)),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false }));
  scene.add(line);
  const nerve = m.kind === 'nerf';
  // Nerf : traits courts et nets (une tête + une traîne). Hormone : nuages larges et diffus.
  const sprites = [];
  const count = nerve ? 2 : 4, trail = nerve ? 6 : 1;
  for (let i = 0; i < count; i++) for (let k = 0; k < trail; k++)
    sprites.push({ sp: glow(color, nerve ? .22 * (1 - k / trail) + .06 : .5), off: i / count, lag: k * .018 });
  const el = document.createElement('div'); el.className = 'sig'; el.textContent = m.label; el.style.color = m.color;
  const tag = new CSS2DObject(el); tag.position.copy(curve.getPointAt(.5)); scene.add(tag);
  paths[p.id] = { p, m, curve, line, sprites, nerve, el, lvl: 0 };
}

// ── Temps : frise logarithmique ──────────────────────────────
const TMIN = 0.01, TMAX = 7200, LMIN = Math.log10(TMIN), LMAX = Math.log10(TMAX);
const toU = t => (Math.log10(Math.max(t, TMIN)) - LMIN) / (LMAX - LMIN);
const fromU = u => 10 ** (LMIN + u * (LMAX - LMIN));
const fmt = t => t < 1 ? `${(t * 1000).toFixed(0)} ms` : t < 60 ? `${t.toFixed(t < 10 ? 1 : 0)} s`
               : t < 3600 ? `${Math.round(t / 60)} min` : `${(t / 3600).toFixed(1).replace('.0', '')} h`;
for (const [t, s] of [[0.01, '10 ms'], [0.1, '0,1 s'], [1, '1 s'], [10, '10 s'], [60, '1 min'], [600, '10 min'], [3600, '1 h']])
  $('ticks').insertAdjacentHTML('beforeend', `<span style="left:${toU(t) * 100}%">${s}</span>`);

// ── Jauges schématiques (définies dans les données) ──────────
const gauges = D.gauges.map(g => {
  $('gauges').insertAdjacentHTML('beforeend',
    `<div class="g"><span>${esc(g.label)}</span><span id="v-${g.id}"></span><canvas id="c-${g.id}"></canvas></div>`);
  return { ...g, fn: new Function('t', `return ${g.f};`), cv: $('c-' + g.id) };
});
$('gauges').insertAdjacentHTML('beforeend', '<small>Courbes schématiques, pas des mesures.</small>');
function drawGauges(t) {
  for (const g of gauges) {
    const c = g.cv, dpr = devicePixelRatio, w = c.clientWidth, h = c.clientHeight;
    if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
    const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    x.beginPath();
    for (let i = 0; i <= 120; i++) { const u = i / 120, v = g.fn(fromU(u)); x.lineTo(u * w, h - 2 - v * (h - 6)); }
    x.strokeStyle = g.color + '55'; x.lineWidth = 1.5; x.stroke();
    const u = toU(t), v = g.fn(t);
    x.beginPath(); x.arc(u * w, h - 2 - v * (h - 6), 3.5, 0, 7); x.fillStyle = g.color; x.fill();
    $('v-' + g.id).textContent = Math.round(v * 100) + ' %';
  }
}

// ── Scénario : temps courts (beats) ──────────────────────────
const beats = D.steps.flatMap((step, si) => step.beats.map((b, bi) => ({ ...b, step, si, bi })));
let cur = 0, tNow = beats[0].t, tGoal = tNow;

function cause(id) {
  const { p, m } = paths[id];
  return `<p class="cause"><b>${esc(nodes[p.from].s.label)}</b> <span class="arrow" style="color:${m.color}">— ${esc(m.label)} →</span> <b>${esc(nodes[p.to].s.label)}</b> : ${esc(p.effect)}</p>`;
}
function more(step) {
  const note = (cls, t, s) => s ? `<div class="note ${cls}"><b>${t}</b>${esc(s)}</div>` : '';
  return note('', 'Simplification', step.simplification) + note('verify', 'À vérifier', step.toVerify) +
    `<div class="badges">${step.evidence.map(e => { const L = D.evidenceLevels[e];
      return `<span class="badge ${L.rank >= 4 ? 'strong' : ''}">${L.label}</span>`; }).join('')}</div>` +
    `<b>Sources</b><ul>${step.sources.map(id => `<li><a href="${D.sources[id].url}" target="_blank" rel="noopener">${esc(D.sources[id].cite)}</a></li>`).join('')}</ul>`;
}
function go(i, fromScrub = false) {
  const prevStep = beats[cur].si;
  cur = Math.max(0, Math.min(beats.length - 1, i));
  const b = beats[cur];
  $('kicker').textContent = b.step.time || 'En résumé';
  $('stepTitle').textContent = `${b.si + 1}. ${b.step.title}`;
  const say = $('say'); say.textContent = b.say; say.className = b.kind === 'insight' ? 'insight' : '';
  $('causes').innerHTML = b.show.map(cause).join('');
  $('dots').innerHTML = b.step.beats.map((_, k) => `<i class="${k <= b.bi ? 'on' : ''}"></i>`).join('');
  if (b.si !== prevStep || !$('moreBody').innerHTML) { $('moreBody').innerHTML = more(b.step); $('more').open = false; }
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === beats.length - 1;
  for (const n of Object.values(nodes)) n.el.classList.toggle('on', b.light.includes(n.s.id));
  for (const p of Object.values(paths)) p.el.classList.toggle('on', b.show.includes(p.p.id));
  if (!fromScrub) { tGoal = b.t; $('scrub').value = Math.round(toU(b.t) * 1000); }
  frame(b);
}
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft') go(cur - 1);
});
$('scrub').addEventListener('input', e => {
  tGoal = tNow = fromU(e.target.value / 1000);
  let i = 0; while (i + 1 < beats.length && beats[i + 1].t <= tNow) i++;
  if (i !== cur) go(i, true);
});

// ── Caméra guidée ────────────────────────────────────────────
const camTarget = new THREE.Vector3(0, -1, 0), camGoalT = camTarget.clone();
let camDist = 14, camGoalD = 14;
const VIEW = new THREE.Vector3(1, .22, 1.15).normalize();
function frame(b) {
  const pts = [...b.light.map(P), ...b.show.flatMap(id => [paths[id].curve.getPointAt(.5)])];
  if (!pts.length) { camGoalT.set(0, -1, 0); camGoalD = 14; return; }
  const box = new THREE.Box3().setFromPoints(pts);
  box.getCenter(camGoalT);
  camGoalD = Math.max(6.5, box.getSize(new THREE.Vector3()).length() * 1.5 + 3.5);
}
const mouse = new THREE.Vector2();
addEventListener('pointermove', e => mouse.set(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));

// ── Boucle ───────────────────────────────────────────────────
function resize() {
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  // décale la scène vers la gauche pour laisser la place au panneau
  if (innerWidth > 860) camera.setViewOffset(innerWidth, innerHeight, 230, 0, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
$('title').textContent = D.title; $('subtitle').textContent = D.subtitle;
go(0);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime, b = beats[cur];
  // temps du scénario : glisse en douceur (en échelle log) vers le temps du beat
  tNow = 10 ** (Math.log10(tNow) + (Math.log10(tGoal) - Math.log10(tNow)) * Math.min(1, dt * 2.5));
  $('now').textContent = '+ ' + fmt(tNow);
  drawGauges(tNow);

  for (const n of Object.values(nodes)) {
    n.lit += ((b.light.includes(n.s.id) ? 1 : 0) - n.lit) * dt * 3;
    n.halo.material.opacity = n.lit * (.55 + .2 * Math.sin(t * 2.4));
    n.core.material.opacity = (n.s.shell ? .05 : .07) + n.lit * (n.s.shell ? .2 : .3);
  }
  for (const p of Object.values(paths)) {
    p.lvl += ((b.show.includes(p.p.id) ? 1 : 0) - p.lvl) * dt * 3;
    p.line.material.opacity = .035 + p.lvl * (p.nerve ? .55 : .3);
    for (const q of p.sprites) {
      const u = ((t * p.m.speed * .4 + q.off - q.lag) % 1 + 1) % 1;
      q.sp.position.copy(p.curve.getPointAt(u));
      const env = Math.sin(u * Math.PI);
      if (p.nerve) q.sp.material.opacity = p.lvl * env * (1 - q.lag * 25);
      else { q.sp.material.opacity = p.lvl * env * .55; q.sp.scale.setScalar(.35 + .7 * u); }  // l'hormone se diffuse
    }
  }
  camTarget.lerp(camGoalT, dt * 1.6);
  camDist += (camGoalD - camDist) * dt * 1.6;
  camera.position.copy(camTarget).addScaledVector(VIEW, camDist).add(new THREE.Vector3(mouse.x * 1.2, -mouse.y * .8, 0));
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
</script>
</body>
</html>
