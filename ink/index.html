<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress aigu — encre</title>
<style>
  :root {
    --bg: #12110f; --ink: #e8e4dc; --muted: #9a958c; --line: #2c2a26;
    --panel: rgba(18,17,15,.88); --accent: #2fd6b5; --warn: #ffb020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Georgia, "Times New Roman", serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  header { position: fixed; top: 16px; left: 16px; right: 16px; pointer-events: none; }
  header h1 { margin: 0; font-weight: normal; font-size: 22px; letter-spacing: .02em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .label { font: 12px/1.2 system-ui, sans-serif; color: var(--muted); white-space: nowrap;
    transition: color .4s, opacity .4s; opacity: .55; pointer-events: none; }
  .label.on { color: var(--ink); opacity: 1; }

  #panel { position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px));
    max-height: calc(100vh - 120px); overflow: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; backdrop-filter: blur(6px); }
  #panel .time { font: 12px system-ui, sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  #panel h2 { margin: 4px 0 8px; font-weight: normal; font-size: 20px; }
  #panel p { margin: 0 0 10px; }
  .note { font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; color: #cfcac1; }
  .note b { font: 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; }
  .note.verify { border-color: var(--warn); }
  .note.insight { border-color: var(--accent); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .badge { font: 11px system-ui, sans-serif; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.strong { border-color: var(--accent); color: var(--ink); }
  details { font-size: 12px; color: var(--muted); margin-top: 6px; }
  details a { color: var(--ink); }
  details li { margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 11px system-ui, sans-serif; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 4px; }

  nav { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  nav button { font: 13px system-ui, sans-serif; background: none; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  nav button:hover:not(:disabled) { border-color: var(--muted); }
  nav button:disabled { opacity: .3; cursor: default; }
  nav .count { margin-left: auto; font: 12px system-ui, sans-serif; color: var(--muted); }

  #timeline { position: fixed; left: 16px; bottom: 16px; width: min(380px, calc(100vw - 470px)); font: 11px system-ui, sans-serif; color: var(--muted); }
  #timeline .bar { position: relative; height: 1px; background: var(--line); margin: 18px 0 6px; }
  #timeline .tick { position: absolute; top: -3px; width: 1px; height: 7px; background: var(--muted); }
  #timeline .tick span { position: absolute; top: 10px; transform: translateX(-50%); white-space: nowrap; }
  #timeline .cap { margin-top: 26px; }
  #timeline .mark { position: absolute; top: -5px; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent); transition: left .8s ease, opacity .4s; }
  @media (max-width: 760px) {
    #timeline { top: 72px; bottom: auto; width: calc(100vw - 32px); }
    #panel { max-height: 48vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<header>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</header>
<div id="timeline"><div class="bar" id="bar"><div class="mark" id="mark"></div></div><div class="cap">Échelle de temps logarithmique</div></div>
<aside id="panel" aria-live="polite">
  <div class="time" id="time"></div>
  <h2 id="stepTitle"></h2>
  <div id="body"></div>
  <nav>
    <button id="prev" aria-label="Étape précédente">←</button>
    <button id="next" aria-label="Étape suivante">→</button>
    <span class="count" id="count"></span>
  </nav>
</aside>

<script src="data/stress-aigu.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const D = window.INK_SCENARIO;
const $ = id => document.getElementById(id);

// ── Scène ────────────────────────────────────────────────────
const host = $('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
host.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12110f);
scene.fog = new THREE.Fog(0x12110f, 7, 16);   // profondeur : le lointain s'estompe
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(5.5, 1.2, 7);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.4, 0.3);
controls.enableDamping = true;
controls.minDistance = 4; controls.maxDistance = 16;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(3, 5, 4); scene.add(key);

// ── Structures ───────────────────────────────────────────────
const nodes = {};
for (const s of D.structures) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xe8e4dc, roughness: .8, transparent: true,
    opacity: s.shell ? .12 : .35, emissive: 0x000000, depthWrite: !s.shell,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(s.size, 40, 24), mat);
  mesh.position.fromArray(s.pos);
  scene.add(mesh);
  const el = document.createElement('div');
  el.className = 'label'; el.textContent = s.label;
  if (s.detail) el.title = s.detail;
  const lab = new CSS2DObject(el);
  lab.position.set(0, s.shell ? -s.size - .15 : s.size + .12, 0);
  mesh.add(lab);
  nodes[s.id] = { data: s, mesh, mat, el, glow: 0 };
}

// ── Voies (filaments) ────────────────────────────────────────
const pos = id => new THREE.Vector3().fromArray(nodes[id].data.pos);
const paths = {};
for (const p of D.pathways) {
  const a = pos(p.from), b = pos(p.to);
  const mid = p.via ? new THREE.Vector3().fromArray(p.via)
                    : a.clone().lerp(b, .5).add(new THREE.Vector3(0, .25, 0));
  const curve = new THREE.CatmullRomCurve3([a, mid, b]);
  const m = D.messengers[p.messenger];
  const color = new THREE.Color(m.color);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curve.getPoints(64)),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: .08 }));
  scene.add(line);
  // impulsions qui voyagent le long du filament
  const pulses = [];
  for (let i = 0; i < 3; i++) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.05, 12, 8),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 }));
    scene.add(dot); pulses.push({ dot, offset: i / 3 });
  }
  paths[p.id] = { data: p, curve, line, pulses, speed: m.speed, level: 0 };
}

// ── Frise temporelle (log10 des secondes) ────────────────────
const T0 = Math.log10(0.05), T1 = Math.log10(7200);
const tx = t => (Math.log10(t) - T0) / (T1 - T0) * 100;
for (const [t, s] of [[0.1, '0,1 s'], [1, '1 s'], [60, '1 min'], [3600, '1 h']]) {
  const k = document.createElement('div'); k.className = 'tick'; k.style.left = tx(t) + '%';
  k.innerHTML = `<span>${s}</span>`; $('bar').appendChild(k);
}

// ── Panneau ──────────────────────────────────────────────────
$('title').textContent = D.title;
$('subtitle').textContent = D.subtitle;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let current = 0;

function show(i) {
  current = i;
  const s = D.steps[i];
  $('time').textContent = s.time;
  $('stepTitle').textContent = s.title;
  const badges = s.evidence.map(e => {
    const L = D.evidenceLevels[e];
    return `<span class="badge ${L.rank >= 4 ? 'strong' : ''}">${L.label}</span>`;
  }).join('');
  const note = (cls, title, txt) => txt ? `<p class="note ${cls}"><b>${title}</b>${esc(txt)}</p>` : '';
  const used = [...new Set(s.pathways.map(id => paths[id].data.messenger))];
  $('body').innerHTML =
    `<p>${esc(s.text)}</p>` +
    note('insight', 'À retenir', s.insight) +
    note('', 'Simplification', s.simplification) +
    note('verify', 'À vérifier', s.toVerify) +
    `<div class="badges">${badges}</div>` +
    (used.length ? `<div class="legend">${used.map(k =>
      `<span><i style="background:${D.messengers[k].color}"></i>${D.messengers[k].label}</span>`).join('')}</div>` : '') +
    `<details><summary>Sources (${s.sources.length})</summary><ul>${s.sources.map(id => {
      const src = D.sources[id];
      return `<li><a href="${src.url}" target="_blank" rel="noopener">${esc(src.cite)}</a></li>`;
    }).join('')}</ul></details>`;
  $('prev').disabled = i === 0;
  $('next').disabled = i === D.steps.length - 1;
  $('count').textContent = `${i + 1} / ${D.steps.length}`;
  const mark = $('mark');
  mark.style.opacity = s.t == null ? 0 : 1;
  if (s.t != null) mark.style.left = tx(s.t) + '%';
  for (const n of Object.values(nodes)) n.el.classList.toggle('on', s.structures.includes(n.data.id));
}
$('prev').onclick = () => current > 0 && show(current - 1);
$('next').onclick = () => current < D.steps.length - 1 && show(current + 1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'ArrowLeft') $('prev').click();
});
show(0);

// ── Animation ────────────────────────────────────────────────
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labels.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  const step = D.steps[current];
  for (const n of Object.values(nodes)) {
    const target = step.structures.includes(n.data.id) ? 1 : 0;
    n.glow += (target - n.glow) * dt * 3;
    const base = n.data.shell ? .12 : .3;
    n.mat.opacity = base + n.glow * (n.data.shell ? .2 : .5);
    n.mat.emissive.setScalar(n.glow * (.25 + .1 * Math.sin(t * 3)));
  }
  for (const p of Object.values(paths)) {
    const target = step.pathways.includes(p.data.id) ? 1 : 0;
    p.level += (target - p.level) * dt * 3;
    p.line.material.opacity = .08 + p.level * .7;
    for (const q of p.pulses) {
      const u = (t * p.speed * .35 + q.offset) % 1;
      q.dot.position.copy(p.curve.getPointAt(u));
      q.dot.material.opacity = p.level * Math.sin(u * Math.PI);
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
</script>
</body>
</html>
