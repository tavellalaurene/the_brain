<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress aigu — encre</title>
<style>
  :root { --bg: #0e0d0c; --ink: #f2ede4; --muted: #a39d93; --line: #2e2b27;
    --panel: rgba(14,13,12,.9); --accent: #2fd6b5; --warn: #ffb020; --gold: #f2c46d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 18px/1.55 Georgia, "Times New Roman", serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .sans { font-family: system-ui, sans-serif; }

  header { position: fixed; top: 20px; left: 24px; pointer-events: none; }
  header h1 { margin: 0; font-weight: normal; font-size: 26px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

  .label { font: 14px/1.2 system-ui, sans-serif; color: var(--ink); white-space: nowrap;
    opacity: 0; transition: opacity .5s; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .label.on { opacity: 1; }
  .label.hover { opacity: 1; color: var(--muted); }
  .label.on.hover { color: var(--ink); }
  #leaders line.hover { stroke: rgba(163,157,147,.4); }
  .label span { display: inline-block; will-change: transform; }
  #leaders { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #leaders line { stroke: rgba(242,237,228,.45); stroke-width: 1; transition: opacity .5s; }
  body.staged #leaders { opacity: 0; }
  .sig { font: 600 12px system-ui, sans-serif; padding: 1px 7px; border-radius: 99px; background: rgba(0,0,0,.6);
    border: 1px solid currentColor; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .sig.on { opacity: 1; }

  /* Jauges */

  /* Panneau */
  #panel { position: fixed; right: 24px; top: 50%; transform: translateY(-50%); width: min(440px, calc(100vw - 48px));
    max-height: calc(100vh - 200px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px 22px; backdrop-filter: blur(8px); }
  #kicker { font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
  #stepTitle { margin: 2px 0 12px; font-weight: normal; font-size: 16px; color: var(--muted); }
  #say { font-size: 21px; line-height: 1.45; margin: 0 0 14px; min-height: 3em; transition: opacity .3s; }
  #say.insight { color: var(--accent); }
  #say.insight::before { content: "À retenir"; display: block; font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .cause { font: 14px/1.4 system-ui, sans-serif; color: #d9d3c9; margin: 6px 0; }
  .cause b { font-weight: 600; }
  .nuance { display: inline; font-size: 12px; color: var(--muted); margin: 0; border: 0; padding: 0; }
  .nuance summary { display: inline; cursor: pointer; color: var(--muted); text-decoration: underline dotted; margin-left: 6px; }
  .nuance[open] { display: block; margin-top: 4px; }
  #play { margin-right: 0 !important; font: 14px system-ui, sans-serif; background: none; color: var(--ink); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 12px; cursor: pointer; margin-right: 12px; }
  #caption { display: none; font: 22px/1.4 Georgia, serif; color: var(--ink); margin: 0 0 14px; max-width: 60em; }
  #caption.levers small { color: var(--gold); }
  #caption .lv { display: block; font: 16px/1.45 system-ui, sans-serif; color: #d9d3c9; margin: 4px 0; }
  #caption .lv b { color: var(--ink); margin-right: 4px; }
  #caption small { display: block; font: 12px system-ui, sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
  body.playing #caption { display: block; }
  body.playing #timeline { right: 24px; }
  body.playing #panel { opacity: 0; pointer-events: none; }
  #panel { transition: opacity .5s; }
  #hoodBtn { font: 14px system-ui, sans-serif; background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; margin-left: 8px; }
  #hoodBtn[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); }
  #hood { position: fixed; left: 16px; top: 88px; bottom: 236px; width: min(460px, calc(100vw - 32px)); display: none; flex-direction: column;
    background: rgba(10,10,12,.92); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); font: 13px/1.5 system-ui, sans-serif; }
  body.hood #hood { display: flex; }
  body.hood header { opacity: 0; }
  #hood .tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
  #hood .tabs button { font: 13px system-ui, sans-serif; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #hood .tabs button.on { color: var(--ink); border-color: var(--line); }
  #hoodClose { margin-left: auto; }
  #hoodBody { overflow: auto; padding: 10px 14px 14px; color: #d9d3c9; }
  #hoodBody h4 { margin: 12px 0 4px; font: 600 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); }
  #hoodBody h4:first-child { margin-top: 0; }
  #hoodBody .file { font: 11px ui-monospace, monospace; color: var(--muted); }
  #hoodBody pre { margin: 4px 0 8px; padding: 8px 10px; background: #050506; border: 1px solid #1d1b19; border-radius: 6px; overflow: auto;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfc9bf; white-space: pre; }
  .j-k { color: #9ecbff; } .j-s { color: #b5e3a1; } .j-n { color: #f2c46d; } .j-b { color: #ff8fc7; }
  .j-ref { text-decoration: underline dotted; cursor: help; }
  .pipe { display: grid; gap: 6px; margin: 6px 0 10px; }
  .pipe div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .pipe div b { display: block; font: 12px ui-monospace, monospace; color: var(--ink); }
  .pipe .arrow { border: none; padding: 0; text-align: center; color: var(--muted); }
  body.hood .label span::after { content: attr(data-id); display: block; font: 11px ui-monospace, monospace; color: var(--gold); }
  @media (max-width: 860px) { #hood { top: 72px; bottom: auto; max-height: 45vh; } }
  #levers:not(:empty) { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  #levers h3, #stageLevers h3 { margin: 0 0 8px; font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); }
  .lever { margin: 0 0 8px; font: 15px/1.45 system-ui, sans-serif; }
  .lever summary { cursor: pointer; list-style: none; color: var(--ink); }
  .lever summary::-webkit-details-marker { display: none; }
  .lever .how { color: var(--ink); }
  .lever .chev { color: var(--muted); display: inline-block; transition: transform .2s; }
  .lever[open] .chev { transform: rotate(90deg); }
  .lever .more { font-size: 13px; color: #cfc9bf; margin: 6px 0 4px 10px; border-left: 2px solid var(--gold); padding-left: 10px; }
  .lever .more p { margin: 0 0 6px; }
  .goal { display: inline-block; font: 600 11px system-ui, sans-serif; padding: 1px 8px; border-radius: 99px; margin-right: 6px;
    border: 1px solid var(--gold); color: var(--gold); text-transform: uppercase; letter-spacing: .05em; }
  #stageLevers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 20px; font: 14px/1.4 system-ui, sans-serif; color: #d9d3c9; }
  #stageLevers ul { margin: 0; padding-left: 16px; }
  #stageLevers:empty { display: none; }
  #credit { position: fixed; right: 16px; bottom: 6px; font-size: 11px; color: var(--muted); opacity: .6; text-decoration: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: flex-start; padding: 0 8vw;
    background: linear-gradient(90deg, rgba(14,13,12,.85), rgba(14,13,12,.2) 60%, transparent); transition: opacity 1.2s; }
  #stage .inner { max-width: 520px; }
  #stage h2 { font: normal 40px/1.15 Georgia, serif; margin: 0 0 18px; }
  #stage p { font: 21px/1.5 Georgia, serif; margin: 0 0 12px; color: #ddd6cb; }
  #stage #stageQ { color: var(--accent); }
  #stage .btns { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  #stage button { font: 16px system-ui, sans-serif; background: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  #stage button.primary { border-color: var(--accent); }
  body:not(.staged) #stage { opacity: 0; pointer-events: none; }
  body.staged #panel, body.staged #timeline, body.staged header { opacity: 0; pointer-events: none; }
  #timeline, header { transition: opacity 1s; }
  body.staged .sig, body.staged .label { opacity: 0 !important; }
  .cause .arrow { white-space: nowrap; font-weight: 600; }
  .dots { display: flex; gap: 6px; margin: 16px 0 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--ink); }
  nav { display: flex; align-items: center; gap: 8px; margin-top: 14px; position: sticky; bottom: -20px; padding: 10px 0 12px; background: rgb(14,13,12); z-index: 1; }
  nav button { font: 15px system-ui, sans-serif; background: none; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  nav button.primary { border-color: var(--accent); }
  nav button:hover:not(:disabled) { background: #1c1a17; }
  nav button:disabled { opacity: .3; cursor: default; }
  nav .hint { margin-left: auto; font: 12px system-ui, sans-serif; color: var(--muted); }

  details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; font: 14px/1.5 system-ui, sans-serif; color: #cfc9bf; }
  summary { cursor: pointer; color: var(--muted); }
  .note { border-left: 2px solid var(--line); padding-left: 10px; margin: 10px 0; }
  .note.verify { border-color: var(--warn); }
  .note b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.strong { border-color: var(--accent); color: var(--ink); }
  details a { color: var(--ink); }
  details ul { padding-left: 18px; margin: 6px 0; }

  /* Frise */
  #timeline { position: fixed; left: 24px; right: 500px; bottom: 22px; font: 12px system-ui, sans-serif; color: var(--muted); }
  #timeline .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  #now { color: var(--ink); font-size: 14px; }
  #timeline::before { content: ''; position: absolute; inset: -14px -16px -10px; z-index: -1; border-radius: 12px;
    background: rgba(14,13,12,.82); backdrop-filter: blur(6px); }
  #timeline .main { display: grid; grid-template-columns: 1fr 190px; gap: 14px; align-items: start; }
  #legend { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  #legend button { display: grid; grid-template-columns: 12px 1fr auto; gap: 7px; align-items: center; text-align: left;
    font: 13px system-ui, sans-serif; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; cursor: pointer; }
  #legend button.on { color: var(--ink); border-color: var(--line); }
  #legend i { width: 12px; height: 3px; border-radius: 2px; }
  #legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #track { position: relative; height: 86px; margin-top: 6px; }
  #curves { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 72px; cursor: ew-resize; touch-action: none; }
  #scrub { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
  #timeline .note { font-size: 11px; opacity: .7; margin-top: 2px; }
  #ticks { position: relative; height: 16px; }
  #ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

  @media (max-width: 860px) {
    #panel { top: auto; bottom: 96px; transform: none; max-height: 52vh; right: 16px; }
    #say { font-size: 19px; }
    #timeline { left: 16px; right: 16px; bottom: 16px; }
    header { left: 16px; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<svg id="leaders" aria-hidden="true"></svg>
<header><h1 id="title"></h1><p id="subtitle"></p></header>
<a id="credit" class="sans" target="_blank" rel="noopener"></a>


<aside id="panel" aria-live="polite">
  <div id="kicker"></div>
  <h2 id="stepTitle"></h2>
  <p id="say"></p>
  <div id="causes"></div>
  <div id="levers"></div>
  <div class="dots" id="dots"></div>
  <nav>
    <button id="prev" aria-label="Précédent">←</button>
    <button id="next" class="primary">Suivant →</button>
    <span class="hint">← → pour naviguer · espace pour jouer</span>
  </nav>
  <details id="more"><summary>En savoir plus</summary><div id="moreBody"></div></details>
</aside>

<div id="stage" class="sans"><div class="inner">
  <h2 id="stageTitle"></h2><p id="stageLead"></p><p id="stageQ"></p><div id="stageLevers"></div>
  <div class="btns"><button id="startPlay" class="primary">▶ Lancer l'histoire</button><button id="startStep">Explorer pas à pas</button></div>
</div></div>
<aside id="hood" aria-label="Sous le capot : les données">
  <div class="tabs" role="tablist">
    <button data-tab="moment" class="on">Ce moment</button><button data-tab="element">Élément</button><button data-tab="pipeline">Pipeline</button>
    <button id="hoodClose" aria-label="Fermer">✕</button>
  </div>
  <div id="hoodBody"></div>
</aside>
<div id="timeline">
  <div id="caption" aria-live="polite"><small id="capStep"></small><span id="capSay"></span></div>
  <div class="row"><span><button id="play">▶ Jouer</button><button id="hoodBtn" aria-pressed="false" title="Touche D">⟨/⟩ Sous le capot</button></span><span id="now"></span></div>
  <div class="main">
    <div><div id="track"><canvas id="curves" aria-hidden="true"></canvas>
      <input id="scrub" type="range" min="0" max="1000" step="1" aria-label="Temps écoulé depuis le stimulus"></div>
      <div id="ticks"></div></div>
    <div id="legend" role="group" aria-label="Courbe mise en avant"></div>
  </div>
  <div class="note">Courbes schématiques, pas des mesures. Fais glisser sur la frise pour avancer dans le temps.</div>
</div>

<script src="data/bundle.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Données assemblées par tools/build.mjs (npm run build) : entités partagées + un scénario
const { entities: E, scenarios: SC, body: BODY } = window.INK_DATA;
const D = { ...SC['stress-aigu'], evidenceLevels: E['evidence-levels'], messengers: E.messengers,
            structures: E.structures, pathways: E.pathways, sources: E.sources, gauges: E.gauges, levers: E.levers };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── Rendu ────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$('scene').appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
$('scene').appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0d0c);
scene.fog = new THREE.Fog(0x0e0d0c, 8, 30);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

// Texture de halo (dégradé radial) partagée par toutes les lueurs
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const glow = (color, size) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
  s.scale.setScalar(size); scene.add(s); return s;
};

const fresnelVS = `
  attribute float aFade; varying float vFade; varying vec3 vN; varying vec3 vV;
  void main() {
    vFade = aFade; vN = normalize(normalMatrix * normal);
    vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }`;
const fresnelFS = `
  uniform vec3 uColor; uniform vec3 uWarm; uniform float uPulse; uniform float uPower; uniform float uIntensity;
  varying float vFade; varying vec3 vN; varying vec3 vV;
  void main() {
    float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), uPower);   // 0 de face, 1 sur les bords
    gl_FragColor = vec4(mix(uColor, uWarm, uPulse), f * uIntensity * vFade);
  }`;
const fresnel = (color, power, intensity) => new THREE.ShaderMaterial({
  vertexShader: fresnelVS, fragmentShader: fresnelFS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uColor: { value: new THREE.Color(color) }, uWarm: { value: new THREE.Color(0xff6a5a) },
              uPulse: { value: 0 }, uPower: { value: power }, uIntensity: { value: intensity } } });
// ── Corps : Vénus de Milo (scan SMK, CC0), rendue en verre avec liseré de lumière ──
// Repères relevés sur le modèle (hauteur en mm) : sommet 2118, menton ~1840, poitrine ~1500, taille ~1360, hanches ~1150.
// Conversion vers la scène : échelle 1/100, tête centrée près de (0, 2, 0). Face tournée vers +z.
const bodyG = new THREE.Group(); scene.add(bodyG);   // le corps respire : on anime ce groupe
const STATUE = { scale: BODY.scene.scale, offset: new THREE.Vector3(...BODY.scene.offset), fadeTop: BODY.fade.top, fadeBot: BODY.fade.bottom };
const rimU = { uPulse: { value: 0 } };
function glassStatue(mat) {
  const m = new THREE.MeshStandardMaterial({ color: 0x1a1726, roughness: .45, metalness: 0, normalMap: mat.normalMap,
    transparent: true, opacity: .18, depthWrite: false });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, rimU);
    sh.vertexShader = 'varying float vWY;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  vWY = (modelMatrix * vec4(transformed, 1.0)).y;');
    sh.fragmentShader = 'varying float vWY;\nuniform float uPulse;\n' + sh.fragmentShader.replace('#include <dithering_fragment>', `
      // Fresnel : les bords (normale perpendiculaire au regard) s'allument
      float fr = pow(1.0 - clamp(abs(dot(normal, normalize(vViewPosition))), 0.0, 1.0), 2.4);
      // dégradé vertical : violet en bas, bleu pâle en haut ; réchauffé par le battement du cœur
      vec3 rim = mix(vec3(.62, .45, 1.0), vec3(.80, .88, 1.0), smoothstep(-5.0, 3.0, vWY));
      rim = mix(rim, vec3(1.0, .45, .4), uPulse);
      float fade = smoothstep(${STATUE.fadeBot.toFixed(1)}, ${STATUE.fadeTop.toFixed(1)}, vWY);   // le corps se dissout vers le bas
      gl_FragColor.rgb += rim * fr * 1.1;
      gl_FragColor.a = clamp(gl_FragColor.a + fr * .85, 0.0, 1.0) * fade;
      #include <dithering_fragment>`);
  };
  return m;
}
const bodyMat = { uniforms: rimU };   // utilisé par la boucle (battement)
// le corps est choisi dans les données (data/settings.json) : on charge son fichier, puis on le décode
const bodyScript = document.createElement('script'); bodyScript.src = BODY.model; document.head.appendChild(bodyScript);
bodyScript.onload = () => {
  const bin = Uint8Array.from(atob(window[BODY.global]), c => c.charCodeAt(0)).buffer;
  new GLTFLoader().parse(bin, '', gltf => {
    const root = gltf.scene;
    // Pré-passe de profondeur : le corps est d'abord dessiné « invisible » pour que seule sa surface la plus
    // proche reçoive le liseré (sinon on voit les surfaces internes : orbites, bouche). Dessiné après les
    // structures (renderOrder), il ne les masque pas.
    const meshes = []; root.traverse(o => { if (o.isMesh) meshes.push(o); });
    for (const o of meshes) {
      const depth = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, transparent: true }));
      depth.renderOrder = 10; o.add(depth);
      o.material = glassStatue(o.material); o.material.depthFunc = THREE.LessEqualDepth; o.renderOrder = 11;
    }
    root.scale.setScalar(STATUE.scale); root.position.copy(STATUE.offset);
    bodyG.add(root);
  }, e => console.error('Corps non chargé', e));
};
scene.add(new THREE.HemisphereLight(0xd9d2ff, 0x0e0d0c, .5));
const keyL = new THREE.DirectionalLight(0xe8e0ff, 1.2); keyL.position.set(4, 6, 6); scene.add(keyL);
const rimL = new THREE.DirectionalLight(0xa08cff, 2.2); rimL.position.set(-5, 3, -7); scene.add(rimL);   // contre-jour violet

// ── Cerveau : simple contour de verre (visualisation à repenser) ──
const [bcx, bcy, bcz] = BODY.brain.center, [brx, bry, brz] = BODY.brain.radii;   // calculé par le build depuis la boîte MNI
const BRAIN = { y: bcy, ry: bry, rx: brx, rz: brz, z: bcz, x: bcx };
const brainMat = fresnel(0xffe9c8, 4.5, .18);
const brainGeo = new THREE.SphereGeometry(1, 64, 40); brainGeo.setAttribute('aFade', new THREE.Float32BufferAttribute(new Array(brainGeo.attributes.position.count).fill(1), 1));

               : t < 3600 ? `${Math.round(t / 60)} min` : `${(t / 3600).toFixed(1).replace('.0', '')} h`;
for (const [t, s] of [[0.01, '10 ms'], [0.1, '0,1 s'], [1, '1 s'], [10, '10 s'], [60, '1 min'], [600, '10 min'], [3600, '1 h']])

// Une seule courbe mise en avant : celle de l'étape (donnée du scénario), ou celle choisie dans la légende
let pinned = null;
$('legend').addEventListener('click', e => { const bt = e.target.closest('button'); if (bt) pinned = pinned === bt.dataset.g ? null : bt.dataset.g; });
function drawGauges(t) {
  const focus = pinned || beats[cur].step.gauge;
  const c = $('curves'), dpr = devicePixelRatio, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  const Y = v => h - 3 - v * (h - 8), now = toU(t) * w;
  for (const g of [...gauges].sort((a, b) => (a.id === focus) - (b.id === focus))) {   // la courbe en avant est dessinée en dernier
    const on = g.id === focus;
    if (on) {
      x.beginPath(); x.moveTo(0, h);
      for (let i = 0; i <= 160; i++) { const u = i / 160; x.lineTo(u * w, Y(g.fn(fromU(u)))); }
      x.lineTo(w, h); x.closePath(); x.fillStyle = g.color + '22'; x.fill();
    }
    x.beginPath();
    for (let i = 0; i <= 160; i++) { const u = i / 160; x.lineTo(u * w, Y(g.fn(fromU(u)))); }
    x.strokeStyle = g.color + (on ? 'ee' : '38'); x.lineWidth = on ? 2 : 1.2; x.stroke();
  }
  document.querySelectorAll('#legend button').forEach(bt => bt.classList.toggle('on', bt.dataset.g === focus));
  x.fillStyle = 'rgba(242,237,228,.5)'; x.fillRect(now - .5, 0, 1, h);     // l'instant présent
  for (const g of gauges) {
    const v = g.fn(t); x.beginPath(); x.arc(now, Y(v), g.id === focus ? 4.5 : 2.5, 0, 7); x.fillStyle = g.color + (g.id === focus ? '' : '88'); x.fill();

  }
}

// ── Scénario : temps courts (beats) ──────────────────────────

// Regroupe les flèches de même origine, substance et effet : « A — X → B, C, D : effet »
function causes(ids) {

    if (!groups.has(k)) groups.set(k, { p, to: [], notes: new Set() });
    const g = groups.get(k); g.to.push(nodes[p.to].s.label); if (p.note) g.notes.add(p.note);
  }

    return `<p class="cause"><b>${esc(nodes[p.from].s.label)}</b> <span class="arrow" style="color:${m.color}">— ${esc(m.label)}${p.channel ? ` (${esc(p.channel)})` : ''} →</span> <b>${esc(to.join(', '))}</b> : ${esc(p.effect)}${notes.size ? `<details class="nuance"><summary>Nuance</summary>${[...notes].map(n => esc(n)).join(' ')}</details>` : ''}</p>`; }).join('');

  $('capStep').textContent = `${b.si + 1}. ${b.step.title}`; $('capSay').textContent = b.say;
  $('caption').classList.remove('levers'); if (interlude !== b.step.id) interlude = null;
  $('dots').innerHTML = b.step.beats.map((_, k) => `<i class="${k <= b.bi ? 'on' : ''}"></i>`).join('');

let playTimer = null;

{

  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(Object.values(nodes).map(n => n.core))[0];
  const n = hit && Object.values(nodes).find(n => n.core === hit.object);
  if (n !== hovered) { hovered?.el.classList.remove('hover'); n?.el.classList.add('hover'); hovered = n || null; }
});
addEventListener('pointermove', e => mouse.set(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));

// ── Boucle ───────────────────────────────────────────────────
function resize() {
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  // décale la scène vers la gauche pour laisser la place au panneau
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
$('title').textContent = D.title; $('subtitle').textContent = D.subtitle;
$('credit').textContent = `${BODY.label} · ${BODY.license}`; $('credit').href = BODY.source;
go(0); wide();
function stage(kind) {
  mode = kind; stop(); wide();
  const o = kind === 'intro' ? D.intro : D.outro;
  $('stageTitle').textContent = kind === 'intro' ? D.title : 'En résumé';
  $('stageLead').textContent = o.lead; $('stageQ').textContent = o.question || o.close;
  $('startPlay').textContent = kind === 'intro' ? "▶ Lancer l'histoire" : '↺ Rejouer';
  $('stageLevers').innerHTML = kind === 'intro' ? '' : Object.entries(GOALS).map(([g, name]) =>
    `<div><h3>${name}</h3><ul>${D.levers.filter(l => l.horizon === 'moment' && l.goal === g).map(l => `<li>${esc(l.label)}</li>`).join('')}</ul></div>`).join('') +
    `<div><h3>Sur le long terme</h3><ul>${D.levers.filter(l => l.horizon === 'fond').map(l => `<li>${esc(l.label)}</li>`).join('')}</ul></div>`;
  document.body.classList.add('staged');
}
function enter(playIt) {
  document.body.classList.remove('staged'); mode = 'story';
  if (playIt || cur === beats.length - 1) go(0); else go(cur);
  if (playIt) play();
}
$('startPlay').onclick = () => enter(true);
$('startStep').onclick = () => enter(false);
stage('intro');

const G = Object.fromEntries(gauges.map(g => [g.id, g]));
let hPhase = 0, bPhase = 0, shift = 0;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime, b = beats[cur];
  // temps du scénario : glisse en douceur (en échelle log) vers le temps du beat
  tNow = 10 ** (Math.log10(tNow) + (Math.log10(tGoal) - Math.log10(tNow)) * Math.min(1, dt * 2.5));
  $('now').textContent = '+ ' + fmt(tNow);
  drawGauges(tNow);

  for (const n of Object.values(nodes)) {
    n.lit += ((b.light.includes(n.s.id) ? 1 : 0) - n.lit) * dt * 3;
    n.ringLvl += ((mode === 'story' && leverTargets.has(n.s.id) ? 1 : 0) - n.ringLvl) * dt * 2;
    n.ring.material.opacity = n.ringLvl * (.55 + .25 * Math.sin(t * 1.5)); n.ring.material.rotation = t * .15;
    n.halo.material.opacity = n.lit * (.55 + .2 * Math.sin(t * 2.4));
    n.core.material.opacity = (n.s.shell ? .05 : .22) + n.lit * (n.s.shell ? .08 : .2);
    n.core.scale.setScalar(n.s.shell ? 1 : .3 + .7 * n.lit);   // inactive : petit point ; active : pleine taille
  }
  const heart = G.coeur.fn(tNow), vig = G.vigilance.fn(tNow);
  hPhase += dt * (1.0 + heart * 1.0); bPhase += dt * (.22 + vig * .25);   // fréquences schématiques
  const beat = Math.pow(Math.max(0, Math.sin(hPhase * Math.PI * 2)), 14);
  bodyMat.uniforms.uPulse.value = beat * (.15 + heart * .6);
  const hn = nodes.corps; hn.halo.material.opacity = Math.max(hn.halo.material.opacity, beat * (.25 + heart * .6));
  hn.halo.scale.setScalar(hn.s.size * 5 * (1 + beat * .25));
  for (const p of Object.values(paths)) {
    p.lvl += ((b.show.includes(p.p.id) ? 1 : 0) - p.lvl) * dt * 3;
    p.line.material.opacity = .035 + p.lvl * (p.nerve ? .55 : .3);
    let arrive = 0;
    for (const q of p.sprites) {
      const u = ((t * p.m.speed * .4 + q.off - q.lag) % 1 + 1) % 1;
      q.sp.position.copy(p.curve.getPointAt(u));
      const env = Math.sin(u * Math.PI);
      if (p.nerve) { q.sp.material.opacity = p.lvl * env * (1 - q.lag * 25); if (!q.lag) arrive = Math.max(arrive, u > .8 ? (u - .8) / .2 : 0); }
      else { q.sp.material.opacity = p.lvl * env * .55; q.sp.scale.setScalar(.35 + .7 * u); }  // l'hormone se diffuse
    }
    if (p.burst) p.burst.material.opacity = p.lvl * arrive * arrive;  // libération du neurotransmetteur
  }
  // mouvements lents et amortis ; en plan large, la caméra tourne autour du corps
  if (mode !== 'story') camGoalAz += dt * 7;
  const k = Math.min(1, dt * (mode === 'story' ? 1.1 : .6));
  camTarget.lerp(camGoalT, k); camDist += (camGoalD - camDist) * k;
  camAz += (camGoalAz - camAz) * k; camEl += (camGoalEl - camEl) * k;
  const az = (camAz + 3 * Math.sin(t * .13)) * deg, el = (camEl + 2 * Math.sin(t * .09)) * deg;
  const view = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  camera.position.copy(camTarget).addScaledVector(view, camDist).add(new THREE.Vector3(mouse.x * 1.2, -mouse.y * .8, 0));
  camera.lookAt(camTarget);
  // cadrage : scène à gauche du panneau en mode histoire, à droite du texte en ouverture/conclusion
  // (sous le capot ouvert : le tiroir occupe la gauche, on recentre la scène entre les deux panneaux)
  const shiftGoal = innerWidth > 860 ? (mode === 'story' ? (document.body.classList.contains('hood') ? 0 : 230) : -innerWidth * .2) : 0;
  shift += (shiftGoal - shift) * k;
  camera.setViewOffset(innerWidth, innerHeight, shift, 0, innerWidth, innerHeight);
  renderer.render(scene, camera);
  layoutLabels();
  labels.render(scene, camera);
});

// Étiquettes des structures actives : à droite de leur point, empilées verticalement sans se chevaucher,
// reliées par un trait fin. Les structures inactives n'ont pas d'étiquette.
const GAP = 22, v3 = new THREE.Vector3();
function layoutLabels() {
  const W = innerWidth, H = innerHeight, f = H / 2 / Math.tan(camera.fov * Math.PI / 360);
  const on = [];
  for (const n of Object.values(nodes)) {
    const lit = n.el.classList.contains('on') || n.el.classList.contains('hover');
    n.line.style.opacity = lit ? 1 : 0; n.line.classList.toggle('hover', !n.el.classList.contains('on'));
    if (!lit) continue;
    v3.copy(n.core.position).project(camera);
    const r = n.s.size * f / camera.position.distanceTo(n.core.position);   // rayon à l'écran (px)
    on.push({ n, x: (v3.x + 1) / 2 * W, y: (1 - v3.y) / 2 * H, r, ly: (1 - v3.y) / 2 * H });
  }
  on.sort((a, b) => a.y - b.y);
  for (let i = 1; i < on.length; i++) on[i].ly = Math.max(on[i].ly, on[i - 1].ly + GAP);
  const drift = on.reduce((s, o) => s + o.ly - o.y, 0) / (on.length || 1);   // recentre le groupe
  const lx = Math.max(...on.map(o => o.x + o.r), 0) + 28;                    // colonne commune, à droite du groupe
  for (const o of on) {
    const dy = o.ly - drift - o.y, dx = Math.max(o.r + 10, on.length > 1 ? lx - o.x : o.r + 10);
    o.n.txt.style.transform = `translate(${dx}px, ${dy}px)`;
    const L = o.n.line; L.setAttribute('x1', o.x + o.r * .7); L.setAttribute('y1', o.y);
    L.setAttribute('x2', o.x + dx - 4); L.setAttribute('y2', o.y + dy);
  }
}
</script>
</body>
